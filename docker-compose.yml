x-unlimited-ocr-transformers-image: &unlimited-ocr-transformers-image
  pull_policy: build
  build:
    context: .
    dockerfile: Dockerfile.unlimited-ocr
  image: pandocr-unlimited-ocr-transformers:latest

x-unlimited-ocr-sglang-image: &unlimited-ocr-sglang-image
  pull_policy: build
  build:
    context: .
    dockerfile: Dockerfile.unlimited-ocr-sglang
    args:
      CUDA_BASE_IMAGE: ${UNLIMITED_OCR_SGLANG_CUDA_BASE_IMAGE:-nvidia/cuda:12.9.1-cudnn-devel-ubuntu24.04@sha256:a2e1e2360c85298ac47ec2543b406ab1e8cec42e31ee47e4d32140ebc82e1067}
      UNLIMITED_OCR_SGLANG_WHEEL_URL: ${UNLIMITED_OCR_SGLANG_WHEEL_URL:-https://huggingface.co/baidu/Unlimited-OCR/resolve/07dea832e22aefee32ad281d4b80551282e1c168/wheel/sglang-0.0.0.dev11416%2Bg92e8bb79e-py3-none-any.whl?download=true#sha256=2644a1f349c55f0ca822e70a70679c98475754ec4722c3be1b18a72bac477cd5}
  image: pandocr-unlimited-ocr-sglang:latest

x-ovisocr2-image: &ovisocr2-image
  pull_policy: build
  build:
    context: .
    dockerfile: Dockerfile.ovisocr2
  image: pandocr-ovisocr2:latest

x-hpd-parsing-adapter-image: &hpd-parsing-adapter-image
  pull_policy: build
  build:
    context: .
    dockerfile: Dockerfile.hpd-parsing-adapter
  image: pandocr-hpd-parsing-adapter:latest

x-navidc-ocr-image: &navidc-ocr-image
  pull_policy: build
  build:
    context: .
    dockerfile: Dockerfile.navidc-ocr
  image: pandocr-navidc-ocr:latest

services:
  pandocr-controller:
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PANDOCR_APP_VERSION: ${PANDOCR_APP_VERSION:-0.2.0}
        PANDOCR_GIT_COMMIT: ${PANDOCR_GIT_COMMIT:-}
    image: pandocr-web:latest
    container_name: pandocr-controller
    command: uvicorn controller:app --host 0.0.0.0 --port 8001
    restart: unless-stopped
    environment:
      - PANDOCR_MODEL_CONTROL=docker
      - PANDOCR_MODEL_CONTROLLER_TOKEN=${PANDOCR_MODEL_CONTROLLER_TOKEN:-local-dev-controller-token}
      - PANDOCR_TASK_DATA_DIR=/app/data/tasks
      - PANDOCR_RUNTIME_SETTINGS_FILE=/app/data/runtime-settings.json
      - PANDOCR_CONTROLLER_OCR_LEASE_STORE_ENABLED=1
      - PANDOCR_CONTROLLER_OCR_LEASE_STORE_FILE=/app/data/controller-ocr-leases.json
      - PANDOCR_CONTROLLER_OCR_LEASE_TTL_SECONDS=${PANDOCR_CONTROLLER_OCR_LEASE_TTL_SECONDS:-0}
      - PANDOCR_ACTIVE_MODEL_ON_START=${PANDOCR_ACTIVE_MODEL_ON_START:-paddleocr-vl-1.6}
      - PANDOCR_MODEL_SWITCH_TIMEOUT=${PANDOCR_MODEL_SWITCH_TIMEOUT:-1200}
      - PANDOCR_GPU_RELEASE_TIMEOUT=${PANDOCR_GPU_RELEASE_TIMEOUT:-60}
      - PANDOCR_GPU_RELEASE_STABLE_SAMPLES=${PANDOCR_GPU_RELEASE_STABLE_SAMPLES:-3}
      - PANDOCR_GPU_RELEASE_SAMPLE_INTERVAL_MS=${PANDOCR_GPU_RELEASE_SAMPLE_INTERVAL_MS:-500}
      - PANDOCR_GPU_RELEASE_TOLERANCE_MIB=${PANDOCR_GPU_RELEASE_TOLERANCE_MIB:-128}
      - PANDOCR_GPU_DEVICE_ID=${PANDOCR_GPU_DEVICE_ID:-0}
      - PADDLE_SERVICE_URL=http://paddleocr-vl-api:8080/layout-parsing
      - PADDLE_OCR_SERVICE_URL=http://paddleocr-ocr-api:8080/ocr
      - UNLIMITED_OCR_SERVICE_URL=http://unlimited-ocr-api:8080/ocr
      - OVISOCR2_SERVICE_URL=http://ovisocr2-api:8080/ocr
      - HPD_PARSING_SERVICE_URL=http://hpd-parsing-api:8080/ocr
      - NAVIDC_OCR_SERVICE_URL=http://navidc-ocr-api:8080/ocr
      - VLM_BACKEND=${VLM_BACKEND:-vllm}
      - VLM_IMAGE_TAG_SUFFIX=${VLM_IMAGE_TAG_SUFFIX:-latest-nvidia-gpu-offline}
      - API_IMAGE_TAG_SUFFIX=${API_IMAGE_TAG_SUFFIX:-latest-nvidia-gpu-offline}
      - VLM_IMAGE_DIGEST=${VLM_IMAGE_DIGEST:-}
      - API_IMAGE_DIGEST=${API_IMAGE_DIGEST:-}
      - PANDOCR_ENABLE_UNLIMITED_OCR=${PANDOCR_ENABLE_UNLIMITED_OCR:-0}
      - PANDOCR_ENABLE_OVISOCR2=${PANDOCR_ENABLE_OVISOCR2:-1}
      - PANDOCR_ENABLE_HPD_PARSING=${PANDOCR_ENABLE_HPD_PARSING:-1}
      - PANDOCR_ENABLE_NAVIDC_OCR=${PANDOCR_ENABLE_NAVIDC_OCR:-1}
      # Keep the WebUI catalog in sync with the controller catalog. Without
      # these values the dropdown silently falls back to two default models.
      - PANDOCR_MODEL_CATALOG=${PANDOCR_MODEL_CATALOG:-paddleocr-vl-1.6,pp-ocrv6,ovisocr2,hpd-parsing,navidc-ocr}
      - UNLIMITED_OCR_BACKEND=${UNLIMITED_OCR_BACKEND:-transformers}
      - UNLIMITED_OCR_PRELOAD=${UNLIMITED_OCR_PRELOAD:-1}
      - UNLIMITED_OCR_API_PORT=${UNLIMITED_OCR_API_PORT:-8083}
      - UNLIMITED_OCR_SGLANG_PORT=${UNLIMITED_OCR_SGLANG_PORT:-10000}
      - UNLIMITED_OCR_MODEL_NAME=${UNLIMITED_OCR_MODEL_NAME:-baidu/Unlimited-OCR}
      - UNLIMITED_OCR_MODEL_REVISION=${UNLIMITED_OCR_MODEL_REVISION:-07dea832e22aefee32ad281d4b80551282e1c168}
      - UNLIMITED_OCR_MAX_RENDER_PIXELS=${UNLIMITED_OCR_MAX_RENDER_PIXELS:-60000000}
      - OVISOCR2_MODEL_NAME=${OVISOCR2_MODEL_NAME:-ATH-MaaS/OvisOCR2}
      - OVISOCR2_MODEL_REVISION=${OVISOCR2_MODEL_REVISION:-65c619d374b55d4152e85150fc1b003700bc1f0c}
      - OVISOCR2_API_PORT=${OVISOCR2_API_PORT:-8084}
      - HPD_PARSING_MODEL_NAME=${HPD_PARSING_MODEL_NAME:-PaddlePaddle/HPD-Parsing}
      - HPD_PARSING_IMAGE=${HPD_PARSING_IMAGE:-ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/hpd-parsing-vllm:latest-nvidia-gpu@sha256:87496aa5dd702a7df6c70bb00c29d5bf8d1a0f0505d66b613fafa6f71cd72de2}
      - HPD_PARSING_API_PORT=${HPD_PARSING_API_PORT:-8085}
      - NAVIDC_OCR_MODEL_NAME=${NAVIDC_OCR_MODEL_NAME:-StarDoc-AI/NaviDC-OCR}
      - NAVIDC_OCR_MODEL_REVISION=${NAVIDC_OCR_MODEL_REVISION:-c7179051a52a0a54a549388de89c6aa715cfd0af}
      - NAVIDC_OCR_SOURCE_REVISION=${NAVIDC_OCR_SOURCE_REVISION:-737e185c7b74288091cd4395ea80c14b1f71422b}
      - NAVIDC_OCR_API_PORT=${NAVIDC_OCR_API_PORT:-8086}
      - NAVIDC_OCR_MAX_TOKENS=${NAVIDC_OCR_MAX_TOKENS:-4096}
      - NAVIDC_OCR_PDF_DPI=${NAVIDC_OCR_PDF_DPI:-200}
      - NAVIDC_OCR_MAX_PAGES_PER_REQUEST=${NAVIDC_OCR_MAX_PAGES_PER_REQUEST:-50}
      - NAVIDC_OCR_MAX_RENDER_PIXELS=${NAVIDC_OCR_MAX_RENDER_PIXELS:-60000000}
      - NAVIDC_OCR_DTYPE=${NAVIDC_OCR_DTYPE:-bfloat16}
      - NAVIDC_OCR_BACKEND=${NAVIDC_OCR_BACKEND:-vllm-async-engine}
    volumes:
      - ./static:/app/static:ro
      - ./server.py:/app/server.py:ro
      - ./exporters.py:/app/exporters.py:ro
      - ./controller.py:/app/controller.py:ro
      - ./unlimited_ocr_adapter.py:/app/unlimited_ocr_adapter.py:ro
      - ./Dockerfile.ocr:/app/Dockerfile.ocr:ro
      - ./Dockerfile.unlimited-ocr:/app/Dockerfile.unlimited-ocr:ro
      - ./Dockerfile.unlimited-ocr-sglang:/app/Dockerfile.unlimited-ocr-sglang:ro
      - ./ovisocr2_adapter.py:/app/ovisocr2_adapter.py:ro
      - ./Dockerfile.ovisocr2:/app/Dockerfile.ovisocr2:ro
      - ./hpd_parsing_adapter.py:/app/hpd_parsing_adapter.py:ro
      - ./Dockerfile.hpd-parsing-adapter:/app/Dockerfile.hpd-parsing-adapter:ro
      - ./navidc_ocr_adapter.py:/app/navidc_ocr_adapter.py:ro
      - ./Dockerfile.navidc-ocr:/app/Dockerfile.navidc-ocr:ro
      - ./start-hpd-parsing.sh:/app/start-hpd-parsing.sh:ro
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H X-Pandocr-Controller-Token:$${PANDOCR_MODEL_CONTROLLER_TOKEN} http://localhost:8001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - paddleocr-network
      - pandocr-control-network

  pandocr-office-converter:
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile.office-converter
    image: pandocr-office-converter:latest
    container_name: pandocr-office-converter
    restart: unless-stopped
    environment:
      - PANDOCR_MAX_UPLOAD_MB=${PANDOCR_MAX_UPLOAD_MB:-512}
      - PANDOCR_MAX_HTTP_BODY_MB=${PANDOCR_MAX_HTTP_BODY_MB:-0}
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - pandocr-document-network

  paddleocr-vlm-server:
    profiles: ["paddleocr-vl"]
    image: ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddleocr-genai-${VLM_BACKEND:-vllm}-server:${VLM_IMAGE_TAG_SUFFIX:-latest-nvidia-gpu-offline}${VLM_IMAGE_DIGEST:-}
    container_name: paddleocr-vlm-server
    command: /bin/bash /home/paddleocr/start-vlm.sh
    environment:
      - PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK=True
      - PADDLEOCR_VL_MODEL_NAME=${PADDLEOCR_VL_MODEL_NAME:-PaddleOCR-VL-1.6-0.9B}
      - PANDOCR_VLLM_MIN_TOTAL_MIB=${PANDOCR_VLLM_MIN_TOTAL_MIB:-11264}
      - PANDOCR_VLLM_MIN_REQUIRED_MIB=${PANDOCR_VLLM_MIN_REQUIRED_MIB:-6656}
      - PANDOCR_VLLM_RESERVE_MIB=${PANDOCR_VLLM_RESERVE_MIB:-512}
      - PANDOCR_VLLM_MAX_RATIO=${PANDOCR_VLLM_MAX_RATIO:-0.88}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${PANDOCR_GPU_DEVICE_ID:-0}"]
              capabilities: [gpu]
    user: root
    restart: unless-stopped
    volumes:
      - ./model_cache:/home/paddleocr/.paddlex
      - ./model_cache_ocr:/home/paddleocr/.paddleocr
      - ./start-vlm.sh:/home/paddleocr/start-vlm.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 900s
    networks:
      - paddleocr-network

  paddleocr-vl-api:
    profiles: ["paddleocr-vl"]
    image: ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddleocr-vl:${API_IMAGE_TAG_SUFFIX:-latest-nvidia-gpu-offline}${API_IMAGE_DIGEST:-}
    container_name: paddleocr-vl-api
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      paddleocr-vlm-server:
        condition: service_healthy
    environment:
      - VLM_BACKEND=${VLM_BACKEND:-vllm}
      - PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK=True
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${PANDOCR_GPU_DEVICE_ID:-0}"]
              capabilities: [gpu]
    user: root
    restart: unless-stopped
    volumes:
      - ./model_cache:/home/paddleocr/.paddlex
      - ./model_cache_ocr:/home/paddleocr/.paddleocr
      - ./pipeline_config_vllm.yaml:/home/paddleocr/pipeline_config_vllm.yaml
    command: /bin/bash -c "paddlex --serve --pipeline /home/paddleocr/pipeline_config_${VLM_BACKEND:-vllm}.yaml"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    networks:
      - paddleocr-network

  paddleocr-ocr-api:
    profiles: ["pp-ocrv6"]
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile.ocr
      args:
        API_IMAGE_TAG_SUFFIX: ${API_IMAGE_TAG_SUFFIX:-latest-nvidia-gpu-offline}
        API_IMAGE_DIGEST: ${API_IMAGE_DIGEST:-}
    image: pandocr-ocr-api:latest
    container_name: paddleocr-ocr-api
    ports:
      - "127.0.0.1:8082:8080"
    environment:
      - PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK=True
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${PANDOCR_GPU_DEVICE_ID:-0}"]
              capabilities: [gpu]
    user: root
    restart: unless-stopped
    volumes:
      - ./model_cache_ppocrv6:/home/paddleocr/.paddlex
      - ./model_cache_ppocrv6_ocr:/home/paddleocr/.paddleocr
      - ./pipeline_config_ocr_v6.yaml:/home/paddleocr/pipeline_config_ocr_v6.yaml:ro
    command: /bin/bash -c "paddlex --serve --pipeline /home/paddleocr/pipeline_config_ocr_v6.yaml --host 0.0.0.0 --port 8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    networks:
      - paddleocr-network

  unlimited-ocr-sglang:
    <<: *unlimited-ocr-sglang-image
    profiles: ["unlimited-ocr"]
    container_name: unlimited-ocr-sglang
    ports:
      - "127.0.0.1:${UNLIMITED_OCR_SGLANG_PORT:-10000}:10000"
    environment:
      - HF_HOME=/root/.cache/huggingface
      - CUDA_VISIBLE_DEVICES=${PANDOCR_GPU_DEVICE_ID:-0}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${PANDOCR_GPU_DEVICE_ID:-0}"]
              capabilities: [gpu]
    user: root
    restart: unless-stopped
    shm_size: "32gb"
    volumes:
      - ./model_cache_unlimited_ocr:/root/.cache/huggingface
    command: >
      python3 -m sglang.launch_server
      --model ${UNLIMITED_OCR_MODEL_NAME:-baidu/Unlimited-OCR}
      --revision ${UNLIMITED_OCR_MODEL_REVISION:-07dea832e22aefee32ad281d4b80551282e1c168}
      --served-model-name ${UNLIMITED_OCR_SERVED_MODEL_NAME:-Unlimited-OCR}
      --attention-backend ${UNLIMITED_OCR_ATTENTION_BACKEND:-flashinfer}
      --page-size ${UNLIMITED_OCR_PAGE_SIZE:-1}
      --mem-fraction-static ${UNLIMITED_OCR_MEM_FRACTION_STATIC:-0.8}
      --context-length ${UNLIMITED_OCR_CONTEXT_LENGTH:-32768}
      --enable-custom-logit-processor
      --disable-overlap-schedule
      --skip-server-warmup
      --host 0.0.0.0
      --port 10000
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:10000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 900s
    networks:
      - paddleocr-network

  unlimited-ocr-api:
    <<: *unlimited-ocr-transformers-image
    profiles: ["unlimited-ocr"]
    container_name: unlimited-ocr-api
    ports:
      - "127.0.0.1:${UNLIMITED_OCR_API_PORT:-8083}:8080"
    environment:
      - HF_HOME=/root/.cache/huggingface
      - UNLIMITED_OCR_BACKEND=${UNLIMITED_OCR_BACKEND:-transformers}
      - UNLIMITED_OCR_PRELOAD=${UNLIMITED_OCR_PRELOAD:-1}
      - UNLIMITED_OCR_SGLANG_URL=http://unlimited-ocr-sglang:10000
      - UNLIMITED_OCR_MODEL_NAME=${UNLIMITED_OCR_MODEL_NAME:-baidu/Unlimited-OCR}
      - UNLIMITED_OCR_MODEL_REVISION=${UNLIMITED_OCR_MODEL_REVISION:-07dea832e22aefee32ad281d4b80551282e1c168}
      - UNLIMITED_OCR_SERVED_MODEL_NAME=${UNLIMITED_OCR_SERVED_MODEL_NAME:-Unlimited-OCR}
      - UNLIMITED_OCR_REQUEST_TIMEOUT=${UNLIMITED_OCR_REQUEST_TIMEOUT:-1200}
      - UNLIMITED_OCR_PDF_DPI=${UNLIMITED_OCR_PDF_DPI:-300}
      - UNLIMITED_OCR_MAX_PAGES_PER_REQUEST=${UNLIMITED_OCR_MAX_PAGES_PER_REQUEST:-50}
      - UNLIMITED_OCR_MAX_RENDER_PIXELS=${UNLIMITED_OCR_MAX_RENDER_PIXELS:-60000000}
      - UNLIMITED_OCR_SINGLE_IMAGE_MODE=${UNLIMITED_OCR_SINGLE_IMAGE_MODE:-gundam}
      - UNLIMITED_OCR_MULTI_IMAGE_MODE=${UNLIMITED_OCR_MULTI_IMAGE_MODE:-base}
      - UNLIMITED_OCR_SGLANG_PDF_DPI=${UNLIMITED_OCR_SGLANG_PDF_DPI:-96}
      # The bundled custom no-repeat processor can over-constrain dense
      # tables/equations; the bounded detector/retry handles those safely.
      - UNLIMITED_OCR_ENABLE_NO_REPEAT_PROCESSOR=${UNLIMITED_OCR_ENABLE_NO_REPEAT_PROCESSOR:-0}
      # Keep completion bounded: long PDF pages otherwise have enough room to
      # enter a repeated decoder trace after the real document is complete.
      - UNLIMITED_OCR_MAX_TOKENS=${UNLIMITED_OCR_MAX_TOKENS:-8192}
      - UNLIMITED_OCR_SGLANG_MAX_TOKENS=${UNLIMITED_OCR_SGLANG_MAX_TOKENS:-8192}
      - PANDOCR_RUNTIME_SETTINGS_FILE=/app/data/runtime-settings.json
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${PANDOCR_GPU_DEVICE_ID:-0}"]
              capabilities: [gpu]
    user: root
    restart: unless-stopped
    volumes:
      - ./model_cache_unlimited_ocr:/root/.cache/huggingface
      - ./data:/app/data
    command: uvicorn unlimited_ocr_adapter:app --host 0.0.0.0 --port 8080
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - paddleocr-network

  ovisocr2-api:
    <<: *ovisocr2-image
    profiles: ["ovisocr2"]
    container_name: ovisocr2-api
    ports:
      - "127.0.0.1:${OVISOCR2_API_PORT:-8084}:8080"
    environment:
      - HF_HOME=/root/.cache/huggingface
      - CUDA_VISIBLE_DEVICES=${PANDOCR_GPU_DEVICE_ID:-0}
      - VLLM_USE_FLASHINFER_SAMPLER=0
      - OVISOCR2_MODEL_NAME=${OVISOCR2_MODEL_NAME:-ATH-MaaS/OvisOCR2}
      - OVISOCR2_MODEL_REVISION=${OVISOCR2_MODEL_REVISION:-65c619d374b55d4152e85150fc1b003700bc1f0c}
      - OVISOCR2_KV_CACHE_MEMORY_MB=${OVISOCR2_KV_CACHE_MEMORY_MB:-512}
      - OVISOCR2_STARTUP_MEMORY_FRACTION=${OVISOCR2_STARTUP_MEMORY_FRACTION:-0.50}
      - OVISOCR2_MAX_MODEL_LEN=${OVISOCR2_MAX_MODEL_LEN:-32768}
      - OVISOCR2_MAX_NUM_SEQS=${OVISOCR2_MAX_NUM_SEQS:-1}
      - OVISOCR2_MAX_TOKENS=${OVISOCR2_MAX_TOKENS:-8192}
      - OVISOCR2_PDF_DPI=${OVISOCR2_PDF_DPI:-200}
      - OVISOCR2_MAX_PAGES_PER_REQUEST=${OVISOCR2_MAX_PAGES_PER_REQUEST:-50}
      - OVISOCR2_GDN_PREFILL_BACKEND=${OVISOCR2_GDN_PREFILL_BACKEND:-triton}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${PANDOCR_GPU_DEVICE_ID:-0}"]
              capabilities: [gpu]
    user: root
    restart: unless-stopped
    shm_size: "16gb"
    volumes:
      - ./model_cache_ovisocr2:/root/.cache/huggingface
      - ./model_cache_ovisocr2_vllm:/root/.cache/vllm
    command: uvicorn ovisocr2_adapter:app --host 0.0.0.0 --port 8080
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 900s
    networks:
      - paddleocr-network

  hpd-parsing-server:
    profiles: ["hpd-parsing"]
    image: ${HPD_PARSING_IMAGE:-ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/hpd-parsing-vllm:latest-nvidia-gpu@sha256:87496aa5dd702a7df6c70bb00c29d5bf8d1a0f0505d66b613fafa6f71cd72de2}
    container_name: hpd-parsing-server
    user: root
    entrypoint: ["/bin/bash"]
    command: ["/home/hpd/start-pandocr.sh"]
    environment:
      - HF_HOME=/home/hpd/.cache/huggingface
      - HF_ENDPOINT=${HF_ENDPOINT:-https://huggingface.co}
      - MAX_PATCHES_WITH_RESIZE=true
      - CUDA_VISIBLE_DEVICES=${PANDOCR_GPU_DEVICE_ID:-0}
      - HPD_PARSING_MODEL_NAME=${HPD_PARSING_MODEL_NAME:-PaddlePaddle/HPD-Parsing}
      - HPD_PARSING_SERVED_MODEL_NAME=${HPD_PARSING_SERVED_MODEL_NAME:-HPD-Parsing}
      - HPD_PARSING_MAX_MODEL_LEN=${HPD_PARSING_MAX_MODEL_LEN:-16384}
      - HPD_PARSING_GPU_MEMORY_UTILIZATION=${HPD_PARSING_GPU_MEMORY_UTILIZATION:-auto}
      - HPD_PARSING_GPU_MEMORY_TARGET_MIB=${HPD_PARSING_GPU_MEMORY_TARGET_MIB:-6656}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${PANDOCR_GPU_DEVICE_ID:-0}"]
              capabilities: [gpu]
    restart: unless-stopped
    shm_size: "32gb"
    volumes:
      - ./model_cache_hpd_parsing:/home/hpd/.cache/huggingface
      - ./start-hpd-parsing.sh:/home/hpd/start-pandocr.sh:ro
    expose:
      - "8118"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8118/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 900s
    networks:
      - paddleocr-network

  hpd-parsing-api:
    <<: *hpd-parsing-adapter-image
    profiles: ["hpd-parsing"]
    container_name: hpd-parsing-api
    ports:
      - "127.0.0.1:${HPD_PARSING_API_PORT:-8085}:8080"
    environment:
      - HPD_PARSING_SERVER_URL=http://hpd-parsing-server:8118
      - HPD_PARSING_SERVED_MODEL_NAME=${HPD_PARSING_SERVED_MODEL_NAME:-HPD-Parsing}
      - HPD_PARSING_MAX_TOKENS=${HPD_PARSING_MAX_TOKENS:-8000}
      - HPD_PARSING_PDF_DPI=${HPD_PARSING_PDF_DPI:-200}
      - HPD_PARSING_MAX_PAGES_PER_REQUEST=${HPD_PARSING_MAX_PAGES_PER_REQUEST:-50}
      - HPD_PARSING_MAX_CONCURRENCY=${HPD_PARSING_MAX_CONCURRENCY:-1}
      - HPD_PARSING_REQUEST_TIMEOUT=${HPD_PARSING_REQUEST_TIMEOUT:-1200}
    depends_on:
      hpd-parsing-server:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - paddleocr-network

  navidc-ocr-api:
    <<: *navidc-ocr-image
    profiles: ["navidc-ocr"]
    container_name: navidc-ocr-api
    ports:
      - "127.0.0.1:${NAVIDC_OCR_API_PORT:-8086}:8080"
    environment:
      - HF_HOME=/root/.cache/huggingface
      - CUDA_VISIBLE_DEVICES=${PANDOCR_GPU_DEVICE_ID:-0}
      - NAVIDC_OCR_MODEL_NAME=${NAVIDC_OCR_MODEL_NAME:-StarDoc-AI/NaviDC-OCR}
      - NAVIDC_OCR_MODEL_REVISION=${NAVIDC_OCR_MODEL_REVISION:-c7179051a52a0a54a549388de89c6aa715cfd0af}
      - NAVIDC_OCR_SOURCE_REVISION=${NAVIDC_OCR_SOURCE_REVISION:-737e185c7b74288091cd4395ea80c14b1f71422b}
      - NAVIDC_OCR_DTYPE=${NAVIDC_OCR_DTYPE:-bfloat16}
      - NAVIDC_OCR_MAX_TOKENS=${NAVIDC_OCR_MAX_TOKENS:-4096}
      - NAVIDC_OCR_PDF_DPI=${NAVIDC_OCR_PDF_DPI:-200}
      - NAVIDC_OCR_MAX_PAGES_PER_REQUEST=${NAVIDC_OCR_MAX_PAGES_PER_REQUEST:-50}
      - NAVIDC_OCR_MAX_RENDER_PIXELS=${NAVIDC_OCR_MAX_RENDER_PIXELS:-60000000}
      - NAVIDC_OCR_BACKEND=${NAVIDC_OCR_BACKEND:-vllm-async-engine}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${PANDOCR_GPU_DEVICE_ID:-0}"]
              capabilities: [gpu]
    user: root
    restart: unless-stopped
    shm_size: "16gb"
    volumes:
      - ./model_cache_navidc_ocr:/root/.cache/huggingface
    command: uvicorn navidc_ocr_adapter:app --host 0.0.0.0 --port 8080
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 900s
    networks:
      - paddleocr-network

  pandocr-web:
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PANDOCR_APP_VERSION: ${PANDOCR_APP_VERSION:-0.2.0}
        PANDOCR_GIT_COMMIT: ${PANDOCR_GIT_COMMIT:-}
    image: pandocr-web:latest
    container_name: pandocr-web
    depends_on:
      pandocr-controller:
        condition: service_healthy
      pandocr-office-converter:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    environment:
      - PANDOCR_HOST=0.0.0.0
      - PADDLE_SERVICE_URL=http://paddleocr-vl-api:8080/layout-parsing
      - PADDLE_OCR_SERVICE_URL=http://paddleocr-ocr-api:8080/ocr
      - UNLIMITED_OCR_SERVICE_URL=http://unlimited-ocr-api:8080/ocr
      - OVISOCR2_SERVICE_URL=http://ovisocr2-api:8080/ocr
      - HPD_PARSING_SERVICE_URL=http://hpd-parsing-api:8080/ocr
      - NAVIDC_OCR_SERVICE_URL=http://navidc-ocr-api:8080/ocr
      - VLM_BACKEND=${VLM_BACKEND:-vllm}
      - VLM_IMAGE_TAG_SUFFIX=${VLM_IMAGE_TAG_SUFFIX:-latest-nvidia-gpu-offline}
      - API_IMAGE_TAG_SUFFIX=${API_IMAGE_TAG_SUFFIX:-latest-nvidia-gpu-offline}
      - VLM_IMAGE_DIGEST=${VLM_IMAGE_DIGEST:-}
      - API_IMAGE_DIGEST=${API_IMAGE_DIGEST:-}
      - PANDOCR_GPU_DEVICE_ID=${PANDOCR_GPU_DEVICE_ID:-0}
      - UNLIMITED_OCR_BACKEND=${UNLIMITED_OCR_BACKEND:-transformers}
      - UNLIMITED_OCR_PRELOAD=${UNLIMITED_OCR_PRELOAD:-1}
      - UNLIMITED_OCR_API_PORT=${UNLIMITED_OCR_API_PORT:-8083}
      - UNLIMITED_OCR_SGLANG_PORT=${UNLIMITED_OCR_SGLANG_PORT:-10000}
      - UNLIMITED_OCR_ATTENTION_BACKEND=${UNLIMITED_OCR_ATTENTION_BACKEND:-flashinfer}
      - UNLIMITED_OCR_MAX_TOKENS=${UNLIMITED_OCR_MAX_TOKENS:-8192}
      - UNLIMITED_OCR_SGLANG_MAX_TOKENS=${UNLIMITED_OCR_SGLANG_MAX_TOKENS:-8192}
      - UNLIMITED_OCR_SGLANG_WHEEL_URL=${UNLIMITED_OCR_SGLANG_WHEEL_URL:-https://huggingface.co/baidu/Unlimited-OCR/resolve/07dea832e22aefee32ad281d4b80551282e1c168/wheel/sglang-0.0.0.dev11416%2Bg92e8bb79e-py3-none-any.whl?download=true#sha256=2644a1f349c55f0ca822e70a70679c98475754ec4722c3be1b18a72bac477cd5}
      - PADDLEOCR_VL_MODEL_NAME=${PADDLEOCR_VL_MODEL_NAME:-PaddleOCR-VL-1.6-0.9B}
      - PANDOCR_VLLM_MIN_TOTAL_MIB=${PANDOCR_VLLM_MIN_TOTAL_MIB:-11264}
      - PANDOCR_VLLM_MIN_REQUIRED_MIB=${PANDOCR_VLLM_MIN_REQUIRED_MIB:-6656}
      - PANDOCR_VLLM_RESERVE_MIB=${PANDOCR_VLLM_RESERVE_MIB:-512}
      - PANDOCR_VLLM_MAX_RATIO=${PANDOCR_VLLM_MAX_RATIO:-0.88}
      - PPOCR_V6_MODEL_NAME=${PPOCR_V6_MODEL_NAME:-PP-OCRv6_medium}
      - UNLIMITED_OCR_MODEL_NAME=${UNLIMITED_OCR_MODEL_NAME:-baidu/Unlimited-OCR}
      - UNLIMITED_OCR_MODEL_REVISION=${UNLIMITED_OCR_MODEL_REVISION:-07dea832e22aefee32ad281d4b80551282e1c168}
      - OVISOCR2_MODEL_NAME=${OVISOCR2_MODEL_NAME:-ATH-MaaS/OvisOCR2}
      - OVISOCR2_MODEL_REVISION=${OVISOCR2_MODEL_REVISION:-65c619d374b55d4152e85150fc1b003700bc1f0c}
      - OVISOCR2_API_PORT=${OVISOCR2_API_PORT:-8084}
      - OVISOCR2_KV_CACHE_MEMORY_MB=${OVISOCR2_KV_CACHE_MEMORY_MB:-512}
      - OVISOCR2_STARTUP_MEMORY_FRACTION=${OVISOCR2_STARTUP_MEMORY_FRACTION:-0.50}
      - OVISOCR2_MAX_MODEL_LEN=${OVISOCR2_MAX_MODEL_LEN:-32768}
      - OVISOCR2_MAX_NUM_SEQS=${OVISOCR2_MAX_NUM_SEQS:-1}
      - OVISOCR2_MAX_TOKENS=${OVISOCR2_MAX_TOKENS:-8192}
      - OVISOCR2_PDF_DPI=${OVISOCR2_PDF_DPI:-200}
      - OVISOCR2_MAX_PAGES_PER_REQUEST=${OVISOCR2_MAX_PAGES_PER_REQUEST:-50}
      - OVISOCR2_GDN_PREFILL_BACKEND=${OVISOCR2_GDN_PREFILL_BACKEND:-triton}
      - HPD_PARSING_MODEL_NAME=${HPD_PARSING_MODEL_NAME:-PaddlePaddle/HPD-Parsing}
      - HPD_PARSING_IMAGE=${HPD_PARSING_IMAGE:-ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/hpd-parsing-vllm:latest-nvidia-gpu@sha256:87496aa5dd702a7df6c70bb00c29d5bf8d1a0f0505d66b613fafa6f71cd72de2}
      - HPD_PARSING_API_PORT=${HPD_PARSING_API_PORT:-8085}
      - HPD_PARSING_SERVED_MODEL_NAME=${HPD_PARSING_SERVED_MODEL_NAME:-HPD-Parsing}
      - HPD_PARSING_MAX_TOKENS=${HPD_PARSING_MAX_TOKENS:-8000}
      - HPD_PARSING_PDF_DPI=${HPD_PARSING_PDF_DPI:-200}
      - HPD_PARSING_MAX_PAGES_PER_REQUEST=${HPD_PARSING_MAX_PAGES_PER_REQUEST:-50}
      - HPD_PARSING_MAX_CONCURRENCY=${HPD_PARSING_MAX_CONCURRENCY:-1}
      - HPD_PARSING_GPU_MEMORY_UTILIZATION=${HPD_PARSING_GPU_MEMORY_UTILIZATION:-auto}
      - HPD_PARSING_GPU_MEMORY_TARGET_MIB=${HPD_PARSING_GPU_MEMORY_TARGET_MIB:-6656}
      - HPD_PARSING_REQUEST_TIMEOUT=${HPD_PARSING_REQUEST_TIMEOUT:-1200}
      - PANDOCR_ENABLE_UNLIMITED_OCR=${PANDOCR_ENABLE_UNLIMITED_OCR:-0}
      - PANDOCR_ENABLE_OVISOCR2=${PANDOCR_ENABLE_OVISOCR2:-1}
      - PANDOCR_ENABLE_HPD_PARSING=${PANDOCR_ENABLE_HPD_PARSING:-1}
      - PANDOCR_ENABLE_NAVIDC_OCR=${PANDOCR_ENABLE_NAVIDC_OCR:-1}
      - PANDOCR_MODEL_CATALOG=${PANDOCR_MODEL_CATALOG:-paddleocr-vl-1.6,pp-ocrv6,ovisocr2,hpd-parsing,navidc-ocr}
      - PADDLE_REQUEST_TIMEOUT=${PADDLE_REQUEST_TIMEOUT:-3600}
      - PANDOCR_MODEL_CONTROL=remote
      - PANDOCR_MODEL_CONTROLLER_URL=http://pandocr-controller:8001
      - PANDOCR_MODEL_CONTROLLER_TOKEN=${PANDOCR_MODEL_CONTROLLER_TOKEN:-local-dev-controller-token}
      - PANDOCR_OFFICE_CONVERTER_URL=http://pandocr-office-converter:8080/convert
      - PANDOCR_ACTIVE_MODEL_ON_START=${PANDOCR_ACTIVE_MODEL_ON_START:-paddleocr-vl-1.6}
      - PANDOCR_MODEL_SWITCH_TIMEOUT=${PANDOCR_MODEL_SWITCH_TIMEOUT:-1200}
      - PANDOCR_TASK_DATA_DIR=/app/data/tasks
      - PANDOCR_CORS_ORIGINS=${PANDOCR_CORS_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      - PANDOCR_MAX_UPLOAD_MB=${PANDOCR_MAX_UPLOAD_MB:-512}
      - PANDOCR_MAX_HTTP_BODY_MB=${PANDOCR_MAX_HTTP_BODY_MB:-0}
      - PANDOCR_MAX_CONCURRENT_OCR=${PANDOCR_MAX_CONCURRENT_OCR:-1}
      - PANDOCR_ENFORCE_ORIGIN_CHECK=${PANDOCR_ENFORCE_ORIGIN_CHECK:-1}
      - PANDOCR_API_TOKEN=${PANDOCR_API_TOKEN:-}
      - PANDOCR_ENABLE_API_DOCS=${PANDOCR_ENABLE_API_DOCS:-0}
    volumes:
      - ./static:/app/static:ro
      - ./server.py:/app/server.py:ro
      - ./exporters.py:/app/exporters.py:ro
      - ./data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - paddleocr-network
      - pandocr-control-network
      - pandocr-document-network

networks:
  paddleocr-network:
    driver: bridge
  pandocr-control-network:
    driver: bridge
    internal: true
  pandocr-document-network:
    driver: bridge
    internal: true

